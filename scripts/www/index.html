<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>打卡升级</title>
<style>
*{box-sizing:border-box;font-family:system-ui;margin:0;padding:0}
body{background:#f5f7fa;padding:16px;max-width:100vw}
.card{background:#fff;border-radius:16px;padding:20px;margin-bottom:16px;box-shadow:0 2px 10px #00000012}
h2{font-size:20px;margin-bottom:16px;color:#222;text-align:center}
.info{display:grid;grid-template-columns:1fr 1fr 1fr;gap:10px;margin-bottom:12px}
.info-item{background:#edf4ff;padding:12px 6px;border-radius:12px;text-align:center}
.info-item span{font-size:18px;font-weight:bold;color:#2b65d9}
.rule-text{font-size:14px;color:#666;text-align:center;margin-top:8px}
.add-row{display:flex;gap:8px;margin-bottom:16px}
#taskInput{flex:1;padding:12px;border:1px solid #ddd;border-radius:12px;font-size:16px}
button{padding:12px 14px;border:0;border-radius:12px;background:#3b78e7;color:#fff;font-size:16px}
button.del{background:#e53e3e}
.task-item{display:flex;justify-content:space-between;align-items:center;padding:14px 0;border-bottom:1px solid #eee;gap:8px}
.task-name{flex:1;font-size:16px}
.checked .task-name{text-decoration:line-through;color:#888}
.btns{display:flex;gap:6px}
</style>
</head>
<body>
<div class="card">
<h2>📈 打卡升级面板</h2>
<div class="info">
<div class="info-item">等级<br><span id="level">1</span></div>
<div class="info-item">经验<br><span id="exp">0</span></div>
<div class="info-item">下级所需<br><span id="nextExp">5</span></div>
</div>
<div class="rule-text">每打卡1次 +1经验；升级经验=当前等级×5</div>
</div>

<div class="card">
<div class="add-row">
<input id="taskInput" placeholder="输入打卡事项">
<button onclick="addTask()">新增</button>
</div>
<div id="taskList"></div>
</div>

<script>
let data = JSON.parse(localStorage.getItem("checkinData")) || {exp:0,level:1,tasks:[]};
function save(){localStorage.setItem("checkinData",JSON.stringify(data));}
function getNeedExp(){return data.level *5;}

function updateUI(){
    document.getElementById("level").innerText=data.level;
    document.getElementById("exp").innerText=data.exp;
    document.getElementById("nextExp").innerText=getNeedExp();
    renderTasks();
}

function checkLevelUp(){
    let need = getNeedExp();
    while(data.exp >= need){
        data.exp -= need;
        data.level +=1;
        alert(`🎉恭喜升级！当前等级：${data.level}`);
        need = getNeedExp();
    }
    save();updateUI();
}

function addTask(){
    let txt = document.getElementById("taskInput").value.trim();
    if(!txt) return;
    data.tasks.push({name:txt,checkedToday:false,id:Date.now()});
    document.getElementById("taskInput").value="";
    save();updateUI();
}

function checkin(id){
    let t = data.tasks.find(x=>x.id===id);
    if(!t) return;
    if(t.checkedToday){alert("今日已打卡该事项！");return;}
    t.checkedToday=true;
    data.exp +=1;
    save();
    checkLevelUp();
}

function delTask(id){
    data.tasks=data.tasks.filter(x=>x.id!==id);
    save();updateUI();
}

function renderTasks(){
    let wrap=document.getElementById("taskList");
    wrap.innerHTML="";
    data.tasks.forEach(t=>{
        let div=document.createElement("div");
        div.className="task-item"+(t.checkedToday?" checked":"");
        div.innerHTML=`
            <div class="task-name">${t.name}</div>
            <div class="btns">
                <button onclick="checkin(${t.id})">${t.checkedToday?"✅已打卡":"打卡+1EXP"}</button>
                <button class="del" onclick="delTask(${t.id})">删</button>
            </div>`;
        wrap.appendChild(div);
    })
}

function resetDaily(){
    let lastDay = localStorage.getItem("lastDay");
    let today = new Date().toDateString();
    if(lastDay!==today){
        data.tasks.forEach(t=>t.checkedToday=false);
        localStorage.setItem("lastDay",today);
        save();
    }
}

resetDaily();
updateUI();
</script>
</body>
</html>
