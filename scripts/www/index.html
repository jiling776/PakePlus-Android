<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>本地音乐播放器｜歌单下拉版</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;font-family:system-ui}
body{background:#121212;color:#eee;padding:16px}
.container{max-width:900px;margin:0 auto}
h2{margin-bottom:16px}
.area{background:#1e1e1e;padding:14px;border-radius:10px;margin-bottom:12px}
button,select,input{padding:8px 12px;border:none;border-radius:6px;font-size:14px;margin:4px}
button{background:#2563eb;color:#fff;cursor:pointer}
button.secondary{background:#333}
#lyricBox{height:220px;overflow:auto;text-align:center;line-height:2.2;color:#aaa}
.lyric-active{color:#38bdf8;font-weight:bold}
.song-item{padding:6px 8px;background:#2a2a2a;border-radius:6px;margin:4px;display:flex;justify-content:space-between;align-items:center}
</style>
</head>
<body>
<div class="container">
  <h2>本地音乐播放器</h2>

  <div class="area">
    <input type="file" id="audioFile" accept="audio/*" multiple>
    <button id="loadLrcBtn">加载LRC歌词</button>
    <br>
    <audio id="audio" controls>
    <div id="lyricBox"></div>
  </div>

  <div class="area">
    <h4>新建歌单</h4>
    <input type="text" id="newFolderName" placeholder="歌单名称">
    <button id="addFolderBtn">创建</button>
  </div>

  <div class="area">
    <h4>添加歌曲到歌单（下拉选择）</h4>
    <select id="folderSelect">
      <option value="">-- 选择歌单 --</option>
    </select>
    <button id="addToFolderBtn">把当前播放歌曲加入选中歌单</button>
  </div>

  <div class="area">
    <h4>歌单列表</h4>
    <div id="folderList"></div>
  </div>
</div>

<script>
let state = {
  folders: [],
  currentAudio: null,
  lyrics: []
}
const audio = document.getElementById('audio')
const audioFileInput = document.getElementById('audioFile')
const lyricBox = document.getElementById('lyricBox')
const folderSelect = document.getElementById('folderSelect')
const folderListEl = document.getElementById('folderList')

// 读取本地存储
function loadData(){
  const raw = localStorage.getItem('musicAppData')
  if(raw) state.folders = JSON.parse(raw)
  renderFolderSelect()
  renderFolderList()
}
function saveData(){
  localStorage.setItem('musicAppData', JSON.stringify(state.folders))
}

// 渲染下拉选项
function renderFolderSelect(){
  folderSelect.innerHTML = `<option value="">-- 选择歌单 --</option>`
  state.folders.forEach((f,idx)=>{
    const opt = document.createElement('option')
    opt.value = idx
    opt.textContent = f.name
    folderSelect.appendChild(opt)
  })
}

// 渲染所有歌单+歌曲
function renderFolderList(){
  folderListEl.innerHTML = ''
  state.folders.forEach((folder,fIdx)=>{
    const wrap = document.createElement('div')
    wrap.style.margin='8px 0';wrap.style.padding='8px';wrap.style.background='#252525';wrap.style.borderRadius='8px'
    wrap.innerHTML = `<b>${folder.name}</b> <button class="secondary del-folder" data-f="${fIdx}">删除歌单</button>`
    folder.songs.forEach((song,sIdx)=>{
      const item = document.createElement('div')
      item.className = 'song-item'
      item.innerHTML = `<span>${song.name}</span>
      <div>
        <button class="play-song" data-f="${fIdx}" data-s="${sIdx}">播放</button>
        <button class="secondary remove-song" data-f="${fIdx}" data-s="${sIdx}">移除</button>
      </div>`
      wrap.appendChild(item)
    })
    folderListEl.appendChild(wrap)
  })
}

// 创建新歌单
document.getElementById('addFolderBtn').onclick = ()=>{
  const name = document.getElementById('newFolderName').value.trim()
  if(!name) return alert('请输入歌单名字')
  state.folders.push({name, songs:[]})
  saveData()
  renderFolderSelect()
  renderFolderList()
  document.getElementById('newFolderName').value=''
}

// 导入音频
audioFileInput.onchange = async e=>{
  const files = Array.from(e.target.files)
  if(!files.length) return
  const file = files[0]
  state.currentAudio = file
  audio.src = URL.createObjectURL(file)
  audio.play()
}

// 添加当前歌曲到选中歌单
document.getElementById('addToFolderBtn').onclick = ()=>{
  const fIdx = folderSelect.value
  if(fIdx === '') return alert('先选一个歌单')
  if(!state.currentAudio) return alert('先导入一首音乐')
  const folder = state.folders[Number(fIdx)]
  const songInfo = {
    name: state.currentAudio.name,
    url: URL.createObjectURL(state.currentAudio)
  }
  folder.songs.push(songInfo)
  saveData()
  renderFolderList()
  alert(`已加入歌单：${folder.name}`)
}

// 加载LRC歌词
document.getElementById('loadLrcBtn').onclick = ()=>{
  const inp = document.createElement('input')
  inp.type='file'
  inp.accept='.lrc'
  inp.onchange = async ev=>{
    const f = ev.target.files[0]
    const txt = await f.text()
    parseLRC(txt)
  }
  inp.click()
}

// 解析LRC
function parseLRC(text){
  state.lyrics = []
  const reg = /\[(\d{2}):(\d{2})\.(\d{2,3})\](.*)/g
  let m
  while(m = reg.exec(text)){
    const time = Number(m[1])*60 + Number(m[2]) + Number(m[3])/1000
    state.lyrics.push({time, text:m[4].trim()})
  }
  state.lyrics.sort((a,b)=>a.time-b.time)
}

// 歌词滚动高亮
audio.ontimeupdate = ()=>{
  const t = audio.currentTime
  let active = ''
  for(let i=0;i<state.lyrics.length;i++){
    if(state.lyrics[i].time <= t) active = state.lyrics[i].text
  }
  lyricBox.innerText = state.lyrics.map(l=>l.text).join('\n')
  const lines = lyricBox.innerText.split('\n')
  let html = ''
  lines.forEach(line=>{
    if(line === active) html += `<div class="lyric-active">${line}</div>`
    else html += `<div>${line}</div>`
  })
  lyricBox.innerHTML = html
}

// 播放、移除事件委托
folderListEl.onclick = e=>{
  const fIdx = Number(e.target.dataset.f)
  const sIdx = Number(e.target.dataset.s)
  if(e.target.classList.contains('play-song')){
    const song = state.folders[fIdx].songs[sIdx]
    audio.src = song.url
    audio.play()
  }else if(e.target.classList.contains('remove-song')){
    state.folders[fIdx].songs.splice(sIdx,1)
    saveData()
    renderFolderList()
  }else if(e.target.classList.contains('del-folder')){
    state.folders.splice(fIdx,1)
    saveData()
    renderFolderSelect()
    renderFolderList()
  }
}

loadData()
</script>
</body>
</html>
