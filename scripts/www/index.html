<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>音乐播放器</title>
<link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>♪</text></svg>">
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --bg:#0f0f14;
  --surface:#1a1a24;
  --surface2:#242433;
  --primary:#e94560;
  --primary2:#ff6b8a;
  --text:#ffffff;
  --text2:#9a9ab0;
  --border:#2e2e3f;
}
body{
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
  background:var(--bg);
  color:var(--text);
  min-height:100vh;
  padding-bottom:120px;
  overflow-x:hidden;
}
/* 顶部栏 */
.header{
  padding:20px 16px 12px;
  position:sticky;top:0;z-index:100;
  background:linear-gradient(180deg,var(--bg) 0%,transparent 100%);
}
.header h1{
  font-size:24px;font-weight:700;margin-bottom:4px;
}
.header .subtitle{
  font-size:13px;color:var(--text2);
}
/* 导航标签 */
.tabs{
  display:flex;gap:8px;padding:0 16px;margin-bottom:16px;
}
.tab{
  padding:8px 16px;border-radius:20px;font-size:14px;
  background:var(--surface);color:var(--text2);
  border:none;cursor:pointer;transition:all .2s;
}
.tab.active{
  background:var(--primary);color:#fff;font-weight:600;
}
/* 歌单网格 */
.playlist-grid{
  display:grid;grid-template-columns:repeat(2,1fr);gap:12px;
  padding:0 16px;margin-bottom:20px;
}
.playlist-card{
  background:var(--surface);border-radius:12px;padding:16px;
  cursor:pointer;transition:transform .15s;
  position:relative;overflow:hidden;
}
.playlist-card:active{transform:scale(.97)}
.playlist-card .cover{
  width:100%;aspect-ratio:1;border-radius:8px;
  background:linear-gradient(135deg,var(--primary),#7b2ff7);
  display:flex;align-items:center;justify-content:center;
  font-size:32px;margin-bottom:12px;
}
.playlist-card .name{
  font-size:14px;font-weight:600;margin-bottom:4px;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.playlist-card .count{
  font-size:12px;color:var(--text2);
}
.playlist-card .del-btn{
  position:absolute;top:8px;right:8px;
  width:28px;height:28px;border-radius:50%;
  background:rgba(0,0,0,.5);border:none;color:#fff;
  font-size:16px;cursor:pointer;display:none;
  align-items:center;justify-content:center;
}
.playlist-card:hover .del-btn{display:flex}
/* 新建歌单 */
.create-playlist{
  background:var(--surface);border:2px dashed var(--border);
  border-radius:12px;padding:16px;cursor:pointer;
  display:flex;flex-direction:column;align-items:center;justify-content:center;
  min-height:160px;color:var(--text2);
}
.create-playlist .plus{
  font-size:36px;margin-bottom:8px;
}
.create-playlist span{font-size:14px}
/* 音乐列表 */
.song-list{padding:0 16px}
.song-item{
  display:flex;align-items:center;gap:12px;
  padding:12px;background:var(--surface);
  border-radius:10px;margin-bottom:8px;
  cursor:pointer;transition:background .15s;
}
.song-item:active{background:var(--surface2)}
.song-item.playing{background:var(--surface2)}
.song-item.playing .song-title{color:var(--primary)}
.song-num{
  width:24px;text-align:center;font-size:14px;color:var(--text2);
  flex-shrink:0;
}
.song-item.playing .song-num{color:var(--primary)}
.song-info{flex:1;min-width:0}
.song-title{
  font-size:14px;font-weight:500;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.song-artist{font-size:12px;color:var(--text2);margin-top:2px}
.song-actions{display:flex;gap:4px;flex-shrink:0}
.song-actions button{
  width:32px;height:32px;border-radius:6px;
  background:transparent;border:none;color:var(--text2);
  font-size:14px;cursor:pointer;
}
.song-actions button:active{background:var(--surface2)}
/* 导入按钮 */
.import-btn{
  display:flex;align-items:center;justify-content:center;gap:8px;
  width:calc(100% - 32px);margin:0 16px 16px;
  padding:14px;border-radius:12px;border:none;
  background:var(--primary);color:#fff;
  font-size:15px;font-weight:600;cursor:pointer;
}
.import-btn:active{opacity:.85}
/* 底部播放栏 */
.player-bar{
  position:fixed;bottom:0;left:0;right:0;
  background:var(--surface);
  border-top:1px solid var(--border);
  padding:12px 16px calc(12px + env(safe-area-inset-bottom));
  z-index:200;
}
.player-progress{
  width:100%;height:4px;background:var(--surface2);
  border-radius:2px;margin-bottom:10px;cursor:pointer;
  position:relative;
}
.player-progress-fill{
  height:100%;background:var(--primary);
  border-radius:2px;width:0%;transition:width .1s linear;
}
.player-main{
  display:flex;align-items:center;gap:12px;
}
.player-info{flex:1;min-width:0}
.player-title{
  font-size:14px;font-weight:600;
  white-space:nowrap;overflow:hidden;text-overflow:ellipsis;
}
.player-artist{font-size:12px;color:var(--text2)}
.player-controls{display:flex;align-items:center;gap:8px}
.player-controls button{
  width:40px;height:40px;border-radius:50%;
  background:transparent;border:none;color:var(--text);
  font-size:18px;cursor:pointer;
  display:flex;align-items:center;justify-content:center;
}
.player-controls button.play-btn{
  width:48px;height:48px;background:var(--primary);
  font-size:20px;
}
.player-controls button:active{opacity:.7}
/* 视图切换 */
.view{display:none}
.view.active{display:block}
/* 空状态 */
.empty-state{
  text-align:center;padding:60px 20px;color:var(--text2);
}
.empty-state .icon{font-size:48px;margin-bottom:16px;opacity:.5}
.empty-state p{font-size:14px;line-height:1.6}
/* 弹窗 */
.modal-mask{
  position:fixed;inset:0;background:rgba(0,0,0,.6);
  z-index:300;display:none;align-items:center;justify-content:center;
  padding:20px;
}
.modal-mask.show{display:flex}
.modal{
  background:var(--surface);border-radius:16px;
  padding:20px;width:100%;max-width:320px;
}
.modal h3{font-size:16px;margin-bottom:16px}
.modal input{
  width:100%;padding:12px;border-radius:8px;
  background:var(--surface2);border:1px solid var(--border);
  color:var(--text);font-size:16px;margin-bottom:16px;
  outline:none;
}
.modal input:focus{border-color:var(--primary)}
.modal-actions{display:flex;gap:8px;justify-content:flex-end}
.modal-actions button{
  padding:8px 16px;border-radius:8px;border:none;
  font-size:14px;cursor:pointer;
}
.modal-actions .cancel{background:var(--surface2);color:var(--text2)}
.modal-actions .confirm{background:var(--primary);color:#fff}
/* 歌单详情头部 */
.detail-header{
  display:flex;align-items:center;gap:12px;
  padding:0 16px 16px;
}
.back-btn{
  width:36px;height:36px;border-radius:50%;
  background:var(--surface);border:none;color:var(--text);
  font-size:18px;cursor:pointer;
  display:flex;align-items:center;justify-content:center;
}
.detail-header h2{font-size:18px;flex:1}
/* 隐藏文件输入 */
#fileInput{display:none}
/* 时间显示 */
.time-display{
  font-size:11px;color:var(--text2);
  display:flex;justify-content:space-between;
  margin-top:4px;
}
</style>
</head>
<body>

<!-- 顶部栏 -->
<div class="header">
  <h1>我的音乐</h1>
  <div class="subtitle" id="totalCount">共 0 首歌曲</div>
</div>

<!-- 标签切换 -->
<div class="tabs">
  <button class="tab active" data-view="all" onclick="switchView('all')">全部歌曲</button>
  <button class="tab" data-view="playlists" onclick="switchView('playlists')">歌单</button>
</div>

<!-- 全部歌曲视图 -->
<div class="view active" id="view-all">
  <button class="import-btn" onclick="document.getElementById('fileInput').click()">
    <span>+</span> 导入音乐文件
  </button>
  <div class="song-list" id="allSongList"></div>
  <div class="empty-state" id="emptyAll">
    <div class="icon">♪</div>
    <p>还没有音乐<br>点击上方按钮导入你的歌曲</p>
  </div>
</div>

<!-- 歌单视图 -->
<div class="view" id="view-playlists">
  <div class="playlist-grid" id="playlistGrid"></div>
  <div class="create-playlist" onclick="openCreatePlaylist()">
    <div class="plus">+</div>
    <span>新建歌单</span>
  </div>
</div>

<!-- 歌单详情视图 -->
<div class="view" id="view-playlist-detail">
  <div class="detail-header">
    <button class="back-btn" onclick="switchView('playlists')">←</button>
    <h2 id="detailPlaylistName"></h2>
  </div>
  <div class="song-list" id="playlistSongList"></div>
  <div class="empty-state" id="emptyPlaylist">
    <div class="icon">♪</div>
    <p>歌单为空<br>从全部歌曲中添加</p>
  </div>
</div>

<!-- 底部播放栏 -->
<div class="player-bar">
  <div class="player-progress" onclick="seekProgress(event)">
    <div class="player-progress-fill" id="progressFill"></div>
  </div>
  <div class="time-display">
    <span id="currentTime">0:00</span>
    <span id="totalTime">0:00</span>
  </div>
  <div class="player-main">
    <div class="player-info">
      <div class="player-title" id="playerTitle">未在播放</div>
      <div class="player-artist" id="playerArtist">添加音乐开始</div>
    </div>
    <div class="player-controls">
      <button onclick="prevSong()">⏮</button>
      <button class="play-btn" id="playBtn" onclick="togglePlay()">▶</button>
      <button onclick="nextSong()">⏭</button>
    </div>
  </div>
</div>

<!-- 新建歌单弹窗 -->
<div class="modal-mask" id="createModal">
  <div class="modal">
    <h3>新建歌单</h3>
    <input type="text" id="playlistNameInput" placeholder="歌单名称" maxlength="20">
    <div class="modal-actions">
      <button class="cancel" onclick="closeCreateModal()">取消</button>
      <button class="confirm" onclick="createPlaylist()">创建</button>
    </div>
  </div>
</div>

<!-- 添加到歌单弹窗 -->
<div class="modal-mask" id="addPlaylistModal">
  <div class="modal">
    <h3>添加到歌单</h3>
    <div id="playlistSelectList"></div>
    <div class="modal-actions">
      <button class="cancel" onclick="closeAddModal()">取消</button>
    </div>
  </div>
</div>

<input type="file" id="fileInput" accept="audio/*" multiple>
<audio id="audioPlayer"></audio>

<script>
// ===== 数据存储 =====
let songs = JSON.parse(localStorage.getItem('mySongs') || '[]');
let playlists = JSON.parse(localStorage.getItem('myPlaylists') || '[]');
let currentIndex = -1;
let currentPlaylist = null; // 当前播放列表
let isPlaying = false;

const audio = document.getElementById('audioPlayer');

// 保存数据
function saveData(){
  localStorage.setItem('mySongs', JSON.stringify(songs));
  localStorage.setItem('myPlaylists', JSON.stringify(playlists));
}

// ===== 视图切换 =====
function switchView(viewName){
  document.querySelectorAll('.view').forEach(v=>v.classList.remove('active'));
  document.querySelectorAll('.tab').forEach(t=>t.classList.remove('active'));
  document.getElementById('view-'+viewName).classList.add('active');
  document.querySelector(`.tab[data-view="${viewName}"]`)?.classList.add('active');
  
  if(viewName === 'playlists') renderPlaylists();
  if(viewName === 'all') renderAllSongs();
}

// ===== 渲染全部歌曲 =====
function renderAllSongs(){
  const list = document.getElementById('allSongList');
  const empty = document.getElementById('emptyAll');
  list.innerHTML = '';
  
  if(songs.length === 0){
    empty.style.display = 'block';
  } else {
    empty.style.display = 'none';
  }
  
  songs.forEach((song, idx) => {
    const item = document.createElement('div');
    item.className = 'song-item' + (idx === currentIndex && currentPlaylist === 'all' ? ' playing' : '');
    item.innerHTML = `
      <div class="song-num">${idx === currentIndex && currentPlaylist === 'all' ? '♪' : idx+1}</div>
      <div class="song-info">
        <div class="song-title">${escapeHtml(song.title)}</div>
        <div class="song-artist">${escapeHtml(song.artist || '未知艺术家')}</div>
      </div>
      <div class="song-actions">
        <button onclick="event.stopPropagation();openAddToPlaylist(${idx})">＋</button>
        <button onclick="event.stopPropagation();removeSong(${idx})">🗑</button>
      </div>
    `;
    item.onclick = () => playSong(idx, 'all');
    list.appendChild(item);
  });
  
  document.getElementById('totalCount').textContent = `共 ${songs.length} 首歌曲`;
}

// ===== 渲染歌单 =====
function renderPlaylists(){
  const grid = document.getElementById('playlistGrid');
  grid.innerHTML = '';
  
  playlists.forEach((pl, idx) => {
    const card = document.createElement('div');
    card.className = 'playlist-card';
    card.innerHTML = `
      <button class="del-btn" onclick="event.stopPropagation();deletePlaylist(${idx})">×</button>
      <div class="cover">♪</div>
      <div class="name">${escapeHtml(pl.name)}</div>
      <div class="count">${pl.songs.length} 首歌曲</div>
    `;
    card.onclick = () => openPlaylistDetail(idx);
    grid.appendChild(card);
  });
}

// ===== 打开歌单详情 =====
function openPlaylistDetail(plIdx){
  const pl = playlists[plIdx];
  document.getElementById('detailPlaylistName').textContent = pl.name;
  document.getElementById('detailPlaylistName').dataset.idx = plIdx;
  
  const list = document.getElementById('playlistSongList');
  const empty = document.getElementById('emptyPlaylist');
  list.innerHTML = '';
  
  if(pl.songs.length === 0){
    empty.style.display = 'block';
  } else {
    empty.style.display = 'none';
  }
  
  pl.songs.forEach((songId, idx) => {
    const song = songs.find(s => s.id === songId);
    if(!song) return;
    const globalIdx = songs.findIndex(s => s.id === songId);
    
    const item = document.createElement('div');
    item.className = 'song-item' + (globalIdx === currentIndex && currentPlaylist === plIdx ? ' playing' : '');
    item.innerHTML = `
      <div class="song-num">${globalIdx === currentIndex && currentPlaylist === plIdx ? '♪' : idx+1}</div>
      <div class="song-info">
        <div class="song-title">${escapeHtml(song.title)}</div>
        <div class="song-artist">${escapeHtml(song.artist || '未知艺术家')}</div>
      </div>
      <div class="song-actions">
        <button onclick="event.stopPropagation();removeFromPlaylist(${plIdx}, ${songId})">−</button>
      </div>
    `;
    item.onclick = () => playSong(globalIdx, plIdx);
    list.appendChild(item);
  });
  
  switchView('playlist-detail');
}

// ===== 导入音乐 =====
document.getElementById('fileInput').addEventListener('change', function(e){
  const files = Array.from(e.target.files);
  files.forEach(file => {
    const url = URL.createObjectURL(file);
    const name = file.name.replace(/\.[^/.]+$/, '');
    songs.push({
      id: Date.now() + Math.random(),
      title: name,
      artist: '本地文件',
      url: url,
      fileName: file.name
    });
  });
  saveData();
  renderAllSongs();
  this.value = '';
});

// ===== 播放控制 =====
function playSong(index, playlistType){
  if(index < 0 || index >= songs.length) return;
  currentIndex = index;
  currentPlaylist = playlistType;
  
  const song = songs[index];
  audio.src = song.url;
  audio.play();
  isPlaying = true;
  
  document.getElementById('playerTitle').textContent = song.title;
  document.getElementById('playerArtist').textContent = song.artist || '未知';
  document.getElementById('playBtn').textContent = '⏸';
  
  renderAllSongs();
  if(typeof currentPlaylist === 'number'){
    openPlaylistDetail(currentPlaylist);
  }
}

function togglePlay(){
  if(currentIndex < 0){
    if(songs.length > 0) playSong(0, 'all');
    return;
  }
  if(audio.paused){
    audio.play();
    isPlaying = true;
    document.getElementById('playBtn').textContent = '⏸';
  } else {
    audio.pause();
    isPlaying = false;
    document.getElementById('playBtn').textContent = '▶';
  }
}

function nextSong(){
  if(songs.length === 0) return;
  let next = currentIndex + 1;
  if(next >= songs.length) next = 0;
  playSong(next, currentPlaylist);
}

function prevSong(){
  if(songs.length === 0) return;
  let prev = currentIndex - 1;
  if(prev < 0) prev = songs.length - 1;
  playSong(prev, currentPlaylist);
}

// 播放结束自动下一首
audio.addEventListener('ended', nextSong);

// 进度条
audio.addEventListener('timeupdate', () => {
  if(audio.duration){
    const pct = (audio.currentTime / audio.duration) * 100;
    document.getElementById('progressFill').style.width = pct + '%';
    document.getElementById('currentTime').textContent = formatTime(audio.currentTime);
    document.getElementById('totalTime').textContent = formatTime(audio.duration);
  }
});

function seekProgress(e){
  const bar = e.currentTarget;
  const rect = bar.getBoundingClientRect();
  const pct = (e.clientX - rect.left) / rect.width;
  if(audio.duration){
    audio.currentTime = pct * audio.duration;
  }
}

function formatTime(sec){
  if(isNaN(sec)) return '0:00';
  const m = Math.floor(sec / 60);
  const s = Math.floor(sec % 60);
  return `${m}:${s.toString().padStart(2,'0')}`;
}

// ===== 新建歌单 =====
function openCreatePlaylist(){
  document.getElementById('createModal').classList.add('show');
  document.getElementById('playlistNameInput').value = '';
  document.getElementById('playlistNameInput').focus();
}

function closeCreateModal(){
  document.getElementById('createModal').classList.remove('show');
}

function createPlaylist(){
  const name = document.getElementById('playlistNameInput').value.trim();
  if(!name) return;
  playlists.push({name: name, songs: []});
  saveData();
  closeCreateModal();
  renderPlaylists();
}

// ===== 删除歌单 =====
function deletePlaylist(idx){
  if(confirm(`确定删除歌单"${playlists[idx].name}"吗？`)){
    playlists.splice(idx, 1);
    saveData();
    renderPlaylists();
  }
}

// ===== 添加到歌单 =====
function openAddToPlaylist(songIdx){
  const songId = songs[songIdx].id;
  const list = document.getElementById('playlistSelectList');
  list.innerHTML = '';
  
  if(playlists.length === 0){
    list.innerHTML = '<p style="color:var(--text2);font-size:14px;padding:12px 0">还没有歌单，请先在"歌单"标签页创建</p>';
  } else {
    playlists.forEach((pl, idx) => {
      const item = document.createElement('div');
      item.style.cssText = 'padding:12px;border-radius:8px;margin-bottom:8px;background:var(--surface2);cursor:pointer;font-size:14px';
      item.textContent = pl.name + (pl.songs.includes(songId) ? ' ✓' : '');
      item.onclick = () => addSongToPlaylist(idx, songId);
      list.appendChild(item);
    });
  }
  
  document.getElementById('addPlaylistModal').classList.add('show');
}

function closeAddModal(){
  document.getElementById('addPlaylistModal').classList.remove('show');
}

function addSongToPlaylist(plIdx, songId){
  const pl = playlists[plIdx];
  if(!pl.songs.includes(songId)){
    pl.songs.push(songId);
    saveData();
  }
  closeAddModal();
}

// ===== 从歌单移除 =====
function removeFromPlaylist(plIdx, songId){
  const pl = playlists[plIdx];
  pl.songs = pl.songs.filter(id => id !== songId);
  saveData();
  openPlaylistDetail(plIdx);
}

// ===== 删除歌曲 =====
function removeSong(idx){
  if(confirm('确定删除这首歌曲吗？')){
    songs.splice(idx, 1);
    // 从所有歌单中移除
    playlists.forEach(pl => {
      pl.songs = pl.songs.filter(id => songs.find(s => s.id === id));
    });
    if(currentIndex === idx){
      audio.pause();
      currentIndex = -1;
      document.getElementById('playerTitle').textContent = '未在播放';
      document.getElementById('playerArtist').textContent = '添加音乐开始';
      document.getElementById('playBtn').textContent = '▶';
    } else if(currentIndex > idx){
      currentIndex--;
    }
    saveData();
    renderAllSongs();
  }
}

// ===== 工具函数 =====
function escapeHtml(str){
  const div = document.createElement('div');
  div.textContent = str;
  return div.innerHTML;
}

// 初始化
renderAllSongs();
</script>
</body>
</html>
